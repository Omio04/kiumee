name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pure-modules:
    name: 순수 모듈 테스트 (:core-model · :domain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core-model:test :domain:test

  android:
    name: Android 모듈 테스트 · mock 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android API 37 플랫폼
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true
      - run: ./gradlew :vision:testDebugUnitTest :voice:testDebugUnitTest :agent:testDebugUnitTest :overlay:testDebugUnitTest :app:testMockDebugUnitTest :app:assembleMockDebug

  server:
    name: 서버 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd server && pip install -r requirements-dev.txt && KL_SKIP_APP_INIT=1 pytest -q
